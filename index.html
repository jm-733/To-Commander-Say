<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To My Commander ❤️</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lockScreen" class="screen">

    <div class="card">

        <h1>🔒💗</h1>

        <h2>To My Commander</h2>

        <p>This letter is locked.</p>

        <input
            type="password"
            id="password"
            placeholder="Enter Password">

        <button id="unlockBtn">
            Unlock My Heart ❤️
        </button>

        <p id="error"></p>

    </div>

</div>

<!-- GALLERY -->
<div id="galleryScreen" class="screen hidden">

    <h1 class="title">Our Memories ❤️</h1>

    <div class="gallery">

        <img src="images/photo1.jpg" class="photo">
        <img src="images/photo2.jpg" class="photo">
        <img src="images/photo3.jpg" class="photo">
        <img src="images/photo4.jpg" class="photo">
        <img src="images/photo5.jpg" class="photo">

    </div>

</div>

<audio id="bgMusic" loop>
    <source src="music/song.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>

</body>
</html>
<script src="script.js"></script>
